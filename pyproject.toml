[project]
name = "spite"
version = "0.1.0"
description = "Experimental software delivery forecasting with probability distributions and simulation"
readme = "README.md"
authors = [
    { name = "longicorn", email = "longicorn.c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyyaml>=6.0.2",
    "scipy>=1.18.1",
]

[project.scripts]
spite = "spite:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
